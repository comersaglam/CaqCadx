{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Polyp IQ Labeling{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">Polyp IQ</a>
        <div>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="{% url 'labeling:annotate' %}">Start Labeling</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'payments:dashboard' %}">Payments</a></li>
          </ul>
        </div>
        <div class="d-flex">
          {% if user.is_authenticated %}
            <span class="navbar-text me-2">Hi, {{ user.get_username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'account_logout' %}">Logout</a>

          {% else %}
            <a class="btn btn-outline-light btn-sm"
              href="{% url 'account_login' %}?next={% url 'labeling:start' %}">
              Login with Google
            </a>
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Content -->
    <main class="container mt-4">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-3 mt-4">
      <div class="container">
        © {{ now|date:"Y" }} — Research Labeling Platform
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
