{% load i18n %}
{% load account %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% trans "Reset Password" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="d-flex align-items-center bg-light" style="min-height:100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">{% trans "Reset Password" %}</h2>

              <p class="text-muted">{% trans "Enter your email address below, and we’ll send you a link to reset your password." %}</p>

              <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">{% trans "Reset my password" %}</button>
              </form>

              <p class="text-center mt-3 mb-0">
                <a href="{% url 'account_login' %}">{% trans "Back to login" %}</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
