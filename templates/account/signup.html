{% load i18n %}
{% load account socialaccount %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% trans "Sign Up" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="d-flex align-items-center bg-light" style="min-height:100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">{% trans "Create Account" %}</h2>

              <form method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                {{ form.as_p }}
                {# templates/account/signup.html #}

                <button type="submit" class="btn btn-success w-100">{% trans "Sign Up" %}</button>
              </form>

              <hr class="my-4">

              <a href="{% provider_login_url 'google' process='signup' next=redirect_field_value %}"
                 class="btn btn-outline-dark w-100 mb-2">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google"
                     style="width:18px; margin-right:8px; vertical-align:middle;">
                {% trans "Sign up with Google" %}
              </a>

              <p class="text-center mt-3 mb-0">
                {% trans "Already have an account?" %}
                <a href="{% url 'account_login' %}">{% trans "Login" %}</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
