{% load i18n %}
{% load account %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% trans "Logout" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="d-flex align-items-center bg-light" style="min-height:100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
              <h2 class="mb-3">{% trans "Are you sure you want to log out?" %}</h2>
              <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">{% trans "Log out" %}</button>
              </form>
              <a href="/" class="btn btn-outline-secondary w-100">{% trans "Cancel" %}</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
