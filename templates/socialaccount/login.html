{% load i18n %}
{% load account socialaccount %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% trans "Sign In Via Google" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="d-flex align-items-center bg-light" style="min-height:100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
              <h2 class="mb-3">{% trans "Sign In Via Google" %}</h2>
              <p class="text-muted mb-4">
                {% blocktrans with provider=account.get_provider.name %}
                  You are about to sign in using your {{ provider }} account.
                {% endblocktrans %}
              </p>
                <form method="post" action="">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100">
                        {% trans "Continue" %}
                    </button>
                </form>



              <p class="mt-3">
                <a href="{% url 'account_login' %}" class="small">{% trans "Cancel" %}</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
